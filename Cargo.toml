[package]
name = "chats-openspec"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.4"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
dashmap = "6.2.1"
futures-util = "0.3.34"
getrandom = "0.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "cookies"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[workspace]
members = [".", "stress"]
