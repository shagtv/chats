[package]
name = "chats-stress"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chats-stress"
path = "src/main.rs"

[dependencies]
futures-util = "0.3.34"
hdrhistogram = { version = "7.6.0", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3.27.0"
